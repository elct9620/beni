# Publishes `beni-sys` and `beni` to crates.io via OIDC Trusted
# Publishing. `cargo publish --workspace` (stable since 1.90) orders the
# uploads by dependency (beni-sys first) and waits for index propagation
# between them. Its verify builds compile the packaged crates, which
# needs an archive like any other build, so the gem stages one first and
# names it through BENI_VENDOR_DIR. The manual-recovery shape mirrors the gem's —
# `workflow_dispatch` defaults `push` to false, so a bare dispatch is a
# `cargo publish --dry-run` rehearsal; tick `push` to publish for real.
name: Release Crate

on:
  workflow_dispatch:
    inputs:
      push:
        description: 'Publish the crates to crates.io'
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      push:
        description: 'Publish the crates to crates.io'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

jobs:
  publish-crates:
    name: Publish beni-sys and beni to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/rust
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      # The archive the verify build compiles against. Built through the
      # gem's own task surface, the way a consumer would.
      - name: Build the archive
        run: bundle exec rake beni:build
      # `--allow-dirty` below lets untracked files into the package, and
      # what it lets in is whatever happens to be there. Proving the tree
      # is clean here is what bounds it: the only thing written after
      # this point is the one file the next step generates.
      - name: The working tree is clean before anything is generated
        run: |
          test -z "$(git status --porcelain)" \
            || { git status --porcelain; echo 'refusing to publish from a dirty tree'; exit 1; }
      # The documentation bindings the package carries and git does not.
      # A release is the one case where the host that writes them has to
      # be the host that will read them, and the task refuses anywhere
      # else — this runner is that host.
      - name: Generate the documentation bindings
        run: bundle exec rake docs:bindings:release
      # The other half of the bound, and the one that reaches outside the
      # package: generating runs a whole mruby build and a cargo build,
      # either of which could touch something tracked. Excluding the one
      # path the generator owns is what makes the rest of the tree still
      # answerable for itself. Mirrors `ring`'s mk/package.sh, which
      # brackets its own pregenerated artefacts the same way.
      - name: Nothing but the bindings changed while generating them
        run: |
          dirty=$(git status --porcelain -- ':(exclude)crates/beni-sys/src/bindings_docs.rs')
          test -z "$dirty" \
            || { echo "$dirty"; echo 'generating the bindings changed something else'; exit 1; }
      # `src/*.rs` is the include glob that matches whatever is there, so
      # it is where both mistakes live: the bindings missing, which only
      # docs.rs would notice and only after publishing, and some other
      # generated file riding along on `--allow-dirty`. Naming the whole
      # set rules out both at once.
      - name: The package carries exactly the Rust sources it should
        run: |
          expected=$'src/bindings_docs.rs\nsrc/lib.rs'
          actual=$(cargo package -p beni-sys --list --allow-dirty | grep '^src/.*\.rs$' | sort)
          [ "$actual" = "$expected" ] || {
            echo "beni-sys would publish these Rust sources:"; echo "$actual"
            echo "expected:"; echo "$expected"; exit 1; }
      # --allow-dirty because the bindings are generated and untracked.
      # cargo has no narrower flag — --exclude-untracked is a proposal,
      # not a release — so the bound comes from the clean-tree check
      # above and the listing assertion beside it, between them naming
      # the one file this is allowing.
      - name: Dry-run publish
        if: ${{ !inputs.push }}
        run: cargo publish --workspace --dry-run --allow-dirty
        env:
          BENI_VENDOR_DIR: ${{ github.workspace }}/vendor
      # Trusted Publishing: exchange the workflow's OIDC token for a
      # short-lived crates.io token. beni-sys and beni each name two
      # publishers on crates.io: release-please.yml for the chained
      # release and this file for manual dispatch.
      - uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        if: ${{ inputs.push }}
        id: auth
      - name: Publish to crates.io
        if: ${{ inputs.push }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          BENI_VENDOR_DIR: ${{ github.workspace }}/vendor
        run: cargo publish --workspace --allow-dirty
