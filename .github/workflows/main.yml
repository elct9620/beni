name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  # Fast lane: fixture-based unit tests + RuboCop + Steep. No network,
  # no Rust — the gem's pure-Ruby surface across supported Rubies.
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  # Archive-free lane: everything that can be judged without a staged
  # archive. That is formatting, the documentation build a
  # documentation host runs, and the contract that every other build
  # without an archive fails. Anything needing the real FFI surface —
  # clippy, tests, the private-item doc gate — waits for the verify
  # lane, which stages one.
  lint:
    runs-on: ubuntu-latest
    name: Rust lint

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain does not read rust-toolchain.toml, so source
      # the channel from it here to keep a single version of truth.
      - name: Read Rust channel from rust-toolchain.toml
        id: rust
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: rustfmt
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # Without DOCS_RS there is no second shape to fall back to, so the
      # build fails naming what it looked for. The documentation build
      # itself lives in the verify lane now: it reads bindings generated
      # from an upstream-default mruby, and building one is what this
      # lane exists not to do.
      - name: Build without an archive fails
        run: |
          if cargo check -p beni-sys --target-dir target/no-archive; then
            echo "expected the build to fail with no archive discovery variable set"
            exit 1
          fi

  # Integration lane: the repo's full dogfooding chain on every
  # BUILD_PLATFORM detection branch. rust:verify drives a real
  # vendor download (mruby + wasi-sdk), the custom-config host + wasi
  # cross build, cargo test against the native archive, a wasm32
  # check, and the default-ABI leg. Vendor tarballs are not cached
  # here: one real download per build platform is what exercises every
  # BUILD_PLATFORM detection branch, and this lane is the one job
  # per platform.
  verify:
    runs-on: ${{ matrix.os }}
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Read Rust channel from rust-toolchain.toml
        id: rust
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          components: clippy
          targets: wasm32-wasip1
      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: Full compile verification
        run: bundle exec rake rust:verify
      # clippy over the whole surface, possible only here, where
      # rust:verify has staged the vendor toolchain. Discovery is
      # env-driven with no fallback, so the vendor artifacts are named
      # explicitly. One OS suffices: the lints are target-shaped, not
      # host-shaped.
      - name: cargo clippy (linked, host + wasm32-wasip1)
        if: matrix.os == 'ubuntu-latest'
        run: |
          BENI_VENDOR_DIR="$PWD/vendor" \
            cargo clippy --workspace --all-targets -- -D warnings
          MRUBY_LIB_DIR="$PWD/vendor/mruby/build/wasi/lib" WASI_SDK_PATH="$PWD/vendor/wasi-sdk" \
            cargo clippy --workspace --target wasm32-wasip1 -- -D warnings
      # Private items carry the reasoning the public surface leans on,
      # so they are documented too — which needs the real FFI surface
      # and therefore an archive.
      - name: cargo doc (private items)
        if: matrix.os == 'ubuntu-latest'
        run: BENI_VENDOR_DIR="$PWD/vendor" cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # Coverage freshness: every alias relation the manifest claims must
      # still hold in the headers (api:coverage's prerequisite), the
      # committed report must match a fresh regeneration against the
      # staged headers and bindings, and the manifest must name only
      # scanned symbols. Possible only here, where rust:verify has staged
      # the vendor tree; the report is platform-independent, so one OS
      # suffices.
      - name: API coverage freshness
        if: matrix.os == 'ubuntu-latest'
        run: |
          bundle exec rake api:coverage
          git diff --exit-code docs/api_coverage.md

  # Consumer lane: each harness under test/scenarios/ is a
  # consumer-shaped Rakefile run from its own directory through the
  # gem's task interface alone (scenario:setup → beni:build →
  # scenario:verify), plain rake without Bundler. default_host is the
  # zero-configuration path: mruby alone, upstream default config,
  # host target — platform-sensitive (mruby's native toolchain
  # detection), so it runs on every OS this lane covers; the Windows
  # lane runs it against MSVC. generated_config drives the
  # rake beni:config → cross-build chain; the mechanism is
  # platform-independent and the resulting config already builds on
  # all three OS in the verify lane, so one OS suffices. rust_consumer
  # carries on past the artifacts into a cargo project outside the
  # workspace that links them; the linkers themselves are already
  # covered on all three OS by the verify lane, so what is new here —
  # discovery from outside the workspace — needs one OS.
  # embedded_no_compiler is the other consumer posture: a build config
  # that leaves mruby's compiler gem out and a crate with beni's default
  # features off to match. What it pins — that the pair links and that
  # the compile surface is absent — is platform-independent, so one OS
  # suffices. macos_universal is the macOS shipping posture: one mruby
  # target per architecture and one cargo build per architecture, merged
  # with lipo. It is the only lane exercising a cross target outside
  # wasm32, and the pair it crosses between exists on macOS alone.
  scenario:
    runs-on: ${{ matrix.os }}
    name: Scenario ${{ matrix.scenario }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scenario: default_host
          - os: ubuntu-24.04-arm
            scenario: default_host
          - os: macos-latest
            scenario: default_host
          - os: ubuntu-latest
            scenario: generated_config
          - os: ubuntu-latest
            scenario: rust_consumer
            rust: true
          - os: ubuntu-latest
            scenario: embedded_no_compiler
            rust: true
          - os: macos-latest
            scenario: macos_universal
            rust: true
            # The host's own target is already installed; the scenario
            # names both so either macOS runner architecture serves.
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
      # Only the scenarios that carry on into a cargo project reach for
      # cargo; the channel comes from rust-toolchain.toml the same way
      # every other lane sources it.
      - name: Read Rust channel from rust-toolchain.toml
        if: matrix.rust
        id: rust
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.rust_targets }}
      # The verify lane already downloads once per build platform, which
      # is what proves the platform detection; a scenario repeating it
      # proves nothing further and costs 174MB for wasi-sdk. The key
      # carries the pinned versions, so a bump misses cleanly and the
      # download runs for real — and a hit still recomputes every
      # checksum, since only the fetch is skipped.
      - name: Cache the scenario's toolchain tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/scenarios/${{ matrix.scenario }}/vendor/.cache
          key: toolchains-${{ matrix.scenario }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/beni/vendor.rb') }}
      - name: Build through the gem's task interface
        run: rake scenario:setup beni:build scenario:verify
        working-directory: test/scenarios/${{ matrix.scenario }}

  # Windows lane: the MSVC chain, which is the toolchain a downstream
  # Rust extension for Windows is built with. mruby's visualcpp
  # toolchain names the archive and every compile flag differently from
  # the GNU-style toolchains every other lane exercises, and the
  # compile-flags sidecar is where the gem and the crates read that
  # from — so this is the lane that proves the read against a real one.
  # Only host-target scenarios run: wasi-sdk vendors no tarball for a
  # Windows build platform, so a scenario declaring a wasi target is
  # refused here by design.
  windows:
    runs-on: windows-latest
    name: Windows ${{ matrix.scenario }} (MSVC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default_host
          - scenario: rust_consumer
            rust: true

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
      - name: Read Rust channel from rust-toolchain.toml
        if: matrix.rust
        id: rust
        shell: bash
        run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - name: Set up Rust toolchain
        if: matrix.rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
      - name: Cache the scenario's toolchain tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/scenarios/${{ matrix.scenario }}/vendor/.cache
          key: toolchains-${{ matrix.scenario }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/beni/vendor.rb') }}
      # mruby selects its visualcpp toolchain off the environment vcvars
      # sets, and the trampoline compile and binding generation read the
      # same environment for cl.exe and the MSVC headers — so the build
      # runs inside it rather than beside it. vswhere ships at a fixed
      # path, which is why no edition or version is spelled out here.
      - name: Build through the gem's task interface
        shell: cmd
        working-directory: test/scenarios/${{ matrix.scenario }}
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          rake scenario:setup beni:build scenario:verify
