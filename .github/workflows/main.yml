name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  # Fast lane: fixture-based unit tests + RuboCop + Steep. No network,
  # no Rust — the gem's pure-Ruby surface across supported Rubies.
  test:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.3'
          - '3.4'
          - '4.0'

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run the default task
        run: bundle exec rake

  # Archive-free lane: what can be judged without a staged archive.
  # Anything needing the real FFI surface waits for the verify lane.
  lint:
    runs-on: ubuntu-latest
    name: Rust lint

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Rust
        uses: ./.github/actions/rust
        with:
          components: rustfmt
          cache: "true"
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # Without DOCS_RS there is no shape to fall back to, so the build
      # must fail naming what it looked for.
      - name: Build without an archive fails
        run: |
          if cargo check -p beni-sys --target-dir target/no-archive; then
            echo "expected the build to fail with no archive discovery variable set"
            exit 1
          fi

  # Integration lane: rust:verify, the full dogfooding chain, per build
  # platform and mruby release. Tarballs are not cached: a real
  # download is what exercises each platform's detection. A release
  # candidate's cell is experimental and only warns, since the crates
  # promise behavior on final releases alone. It skips its known
  # failures by name, so a new failure still turns it red.
  verify:
    runs-on: ${{ matrix.os }}
    name: Verify (${{ matrix.os }}, mruby ${{ matrix.mruby }})
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
        mruby:
          - 4.0.0
        include:
          - os: ubuntu-latest
            mruby: 4.0.0
            static_checks: true
          - os: ubuntu-latest
            mruby: 4.1.0-rc2
            experimental: true
            # Prism, 4.1's compiler, reports diagnostics and filenames
            # differently until the compile surface is reconciled with it.
            test_skip: >-
              a_filename_too_long_to_be_a_symbol
              warnings_answer_empty_before_a_load_and_after_a_clean_one
              warnings_carry_the_compiler_diagnostics_a_load_produced
              load_string_stamps_no_filename_so_a_raise_carries_no_backtrace
              load_string_still_runs_source_the_compiler_warns_about
    env:
      BENI_MRUBY_VERSION: ${{ matrix.mruby }}
      BENI_TEST_SKIP: ${{ matrix.test_skip }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Set up Rust
        uses: ./.github/actions/rust
        with:
          components: clippy
          targets: wasm32-wasip1
          cache: "true"
      - name: Full compile verification
        run: bundle exec rake rust:verify
      # The checks below read what rust:verify staged and do not vary by
      # host, so one cell runs them. clippy covers every staged width,
      # since each compiles a different set of conversions.
      - name: cargo clippy (linked, every staged ABI + wasm32-wasip1)
        if: matrix.static_checks
        run: |
          BENI_VENDOR_DIR="$PWD/vendor" \
            cargo clippy --workspace --all-targets -- -D warnings
          MRUBY_LIB_DIR="$PWD/tmp/mruby-default-build/host/lib" \
            cargo clippy --workspace --all-targets --target-dir target/default-abi -- -D warnings
          MRUBY_LIB_DIR="$PWD/tmp/mruby-float32-build/host/lib" \
            cargo clippy --workspace --all-targets --target-dir target/float32 -- -D warnings
          MRUBY_LIB_DIR="$PWD/vendor/mruby/build/wasi/lib" WASI_SDK_PATH="$PWD/vendor/wasi-sdk" \
            cargo clippy --workspace --target wasm32-wasip1 -- -D warnings
      # Private items carry the reasoning the public surface leans on.
      - name: cargo doc (private items)
        if: matrix.static_checks
        run: BENI_VENDOR_DIR="$PWD/vendor" cargo doc --workspace --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: -D warnings
      # The committed report must match one regenerated from the staged
      # headers and bindings.
      - name: API coverage freshness
        if: matrix.static_checks
        run: |
          bundle exec rake api:coverage
          git diff --exit-code docs/api_coverage.md

  # Consumer lane: each test/scenarios/ harness through the gem's task
  # interface alone, plain rake without Bundler. A scenario runs on more
  # than one OS only where its outcome depends on the platform. Windows
  # cells build with MSVC, the toolchain a downstream Rust extension for
  # Windows uses. wasi-sdk has no Windows tarball, so only host-target
  # scenarios run there.
  scenario:
    runs-on: ${{ matrix.os }}
    name: Scenario ${{ matrix.scenario }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Zero configuration: mruby's toolchain detection is the
          # platform-sensitive part.
          - os: ubuntu-latest
            scenario: default_host
          - os: ubuntu-24.04-arm
            scenario: default_host
          - os: macos-latest
            scenario: default_host
          - os: windows-latest
            scenario: default_host
            msvc: true
          # beni:config → cross build; the generated config itself
          # builds on every platform in the verify lane.
          - os: ubuntu-latest
            scenario: generated_config
          # Discovery from outside the workspace. MSVC's longjmp unwinds
          # the frames a raise crosses, so the Windows cell also runs the
          # crates' suite.
          - os: ubuntu-latest
            scenario: rust_consumer
            rust: true
          - os: windows-latest
            scenario: rust_consumer
            rust: true
            msvc: true
            suite: true
          # The compiler gem left out, with beni's default features off.
          - os: ubuntu-latest
            scenario: embedded_no_compiler
            rust: true
          # The macOS shipping posture: one build per architecture,
          # merged with lipo; the only cross target outside wasm32.
          - os: macos-latest
            scenario: macos_universal
            rust: true
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f # v1.310.0
        with:
          ruby-version: '3.4'
      - name: Set up Rust
        if: matrix.rust
        uses: ./.github/actions/rust
        with:
          targets: ${{ matrix.rust_targets }}
      # Later steps keep the runner's default shell: bash would put its
      # GNU tools ahead of MSVC's link.exe.
      - name: Set up MSVC
        if: matrix.msvc
        uses: ./.github/actions/msvc
      # The verify lane already proves the download per platform. The key
      # carries the built-in pairs, and a hit still verifies checksums.
      - name: Cache the scenario's toolchain tarballs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: test/scenarios/${{ matrix.scenario }}/vendor/.cache
          key: toolchains-${{ matrix.scenario }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lib/beni/vendor.rb') }}
      - name: Build through the gem's task interface
        run: rake scenario:setup beni:build scenario:verify
        working-directory: test/scenarios/${{ matrix.scenario }}
      # The staged archive is upstream-default: rust:test:default's leg.
      - name: Run the crates' suite against the staged archive
        if: matrix.suite
        env:
          BENI_VENDOR_DIR: ${{ github.workspace }}\test\scenarios\${{ matrix.scenario }}\vendor
        run: cargo test -p beni -p beni-tests
