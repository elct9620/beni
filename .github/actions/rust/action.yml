name: Set up Rust
description: >-
  Install the toolchain rust-toolchain.toml names, with whichever
  components, cross targets and cargo cache the calling lane asks for.

inputs:
  components:
    description: Comma-separated rustup components, empty for none.
    required: false
    default: ""
  targets:
    description: Comma-separated cross targets, empty for the host alone.
    required: false
    default: ""
  cache:
    description: Restore the cargo build cache when "true".
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # dtolnay/rust-toolchain does not read rust-toolchain.toml, so source
    # the channel from it here to keep a single version of truth. bash is
    # the shell on every runner this repo uses, Windows included.
    - name: Read Rust channel from rust-toolchain.toml
      id: channel
      shell: bash
      run: echo "channel=$(grep '^channel' rust-toolchain.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

    # An empty components or targets list expands to no rustup flag, so
    # a lane that wants neither passes neither.
    - name: Install the toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
      with:
        toolchain: ${{ steps.channel.outputs.channel }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo
      if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
