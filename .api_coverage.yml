# Typed-surface coverage manifest
# ================================
#
# Hand-authored record of how the typed `beni` wrapper covers mruby's C
# API. The C symbol *inventory* (the denominator) is scanned from the
# vendored headers by `rake api:coverage`; this file is the *numerator*
# the implementer maintains.
#
# Four sections are keyed by C symbol and a symbol belongs to exactly
# one of them, so its absence from all four means API still owed. They
# fill as the worklist is walked: an unrecorded symbol is one nobody has
# ruled on yet, not one ruled to be missing. Every entry names what
# settles it — a SPEC statement, the graduation rule, or a vendored
# source line — so a classification can be reviewed rather than trusted:
#
#   typed       — keyed by mruby C API symbol (function or function-like
#                 macro, exactly as in the headers). The value is a free
#                 -form Note naming the Rust item(s) that graduate it —
#                 the safe surface a `typed ✅` row points at, so the
#                 checkmark has a verifiable Rust side. List several,
#                 comma-separated, when more than one binds it; add
#                 prose for caveats. A single bare symbol is rendered as
#                 code automatically. A `~` Note is reported as
#                 "unspecified": typed, but its Rust side is unnamed.
#   subsumed    — a graduated Rust item delivers the symbol's whole
#                 capability, the C form differing only in what the Rust
#                 shape already carries (a length the byte slice holds,
#                 an argument count the slice holds). Counts as covered;
#                 the Note names the item and what it carries in the C
#                 form's place. A symbol no graduated item can express
#                 does not belong here, however close their purposes.
#   declined    — public embedder API with no typed shape to add, which
#                 the graduation rule therefore leaves in `beni::sys`.
#                 Leaves the measure entirely. A capability merely
#                 awaiting a carrier is NOT declined, and neither is one
#                 a typed shape could carry but nobody has scoped — both
#                 stay out of every section, as the work they are.
#   conditional — API this ABI does not have because a compile-time flag
#                 gates it. Leaves the measure. Kept apart from declined
#                 because letting a consumer choose its ABI turns this
#                 set into work while declined stays declined; the Note
#                 leads with the gating flag.
#
# Two further sections are not keyed by C symbol:
#
#   extensions  — Rust-native surface with no 1:1 C API (RAII guards,
#                 caches, trait conversions). Documented for context;
#                 not part of the C-API coverage ratio.
#   get_args_formats
#               — the `mrb_get_args` specifier vocabulary, measured as
#                 its own lens: one entry per specifier, each recording
#                 the typed surface that covers it.
#
# Two tiers are derived rather than listed: the raw `sys` FFI surface
# (bindgen + wrapper.h shims), and every symbol a `#define` alias makes
# equivalent to a recorded one — covering either covers both, so
# recording an alias here only duplicates the headers. Record one only
# when its Note names a Rust item the partner's does not, and
# `rake api:aliases` will hold that claim to the headers. A `typed` key
# absent from the scanned inventory is reported as "unknown" by the
# rake task.
---
typed:
  MRB_ARGS_ANY: a typed method's `-1` arity, derived by `Module::define_method`
  MRB_ARGS_NONE: a typed method's `0` arity, derived by `Module::define_method` (the no-argument aspec a zero-arity definition declares)
  MRB_ARGS_ARG: a typed method's required-and-optional arity, derived by `Module::define_method` (the `method!(f, req, opt)` form's aspec)
  MRB_ARGS_BLOCK: a typed method's block-accepting flag, derived by `Module::define_method` (the `method!(f, req, &)` form's aspec, OR-ed into the positional aspec)
  MRB_ARGS_OPT: a typed method's optional positional arity, derived by `Module::define_method` (the optional component of the `method!(f, req, opt)` aspec)
  MRB_ARGS_REQ: a typed method's positional arity, derived by `Module::define_method`
  MRB_SET_INSTANCE_TT: RClass::set_instance_data_tt
  MRB_UNDEF_ALLOCATOR: RClass::undef_default_alloc_func
  RARRAY_LEN: RArray::len
  RARRAY_PTR: RArray::as_slice
  RSTRING_LEN: "`RString::as_bytes`, the owned reads (`FromValue` into `Vec<u8>` / `String`, `RString::to_bytes` with the `bytes` feature), `RString::len`"
  RSTRING_PTR: "`RString::as_bytes`, the owned reads (`FromValue` into `Vec<u8>` / `String`, `RString::to_bytes` with the `bytes` feature)"
