  mrb_class_ptr: "`RClass::from_value`, `RModule::from_value`, `ExceptionClass::from_value` — the checked downcast is the typed unbox of a class value; the pointer itself stays the raw binding's to read, as magnus leaves the class struct"
  mrb_close: Mrb::drop
  mrb_const_defined: "`Module::const_defined` — the constant presence test walking the ancestry; contrast `mrb_const_defined_at`/`Module::const_defined_at`, the direct own-table-only form"
  mrb_const_defined_at: "`Module::const_defined_at` — the direct constant presence test, true only for the receiver's own constant; contrast `mrb_const_defined`/`Module::const_defined`, which walks the ancestry"
  mrb_const_get: Module::const_get
  mrb_const_remove: "`Module::const_remove` — the value-level constant removal; discards the former value (the C API is `void`) and treats an absent constant as a no-op"
  mrb_const_set: Module::const_set
  mrb_cv_defined: "`Module::cvar_defined` — the value-level class-variable presence test, walking the ancestry; `mrb_mod_cv_defined` (the raw-`RClass*` form) stays in `sys`"
