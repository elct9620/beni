# Symbols admitted from a header mruby marks internal to the library.
# They are not embedder API, so they enter neither side of the ratio;
# each is recorded here with the typed item it was admitted for, which
# is the only thing that admits one — nothing enters on the chance a
# consumer might want it.
admitted:
  mrb_dump_irep: "`Proc::dump` — the only call that renders an IREP as the bytecode `mrb_read_irep_buf` reads back; `mrb_dump_irep_binary` is the published counterpart but writes to a `FILE*` and is compiled only outside `MRB_NO_STDIO`, so it delivers neither the buffer nor the availability. Declared at `vendor/mruby/include/mruby/internal.h:41`, reached through the single declaration `crates/beni-sys/src/wrapper.h` copies rather than by including that header"

extensions:
  Error: >-
    Result-based error model: a handler's `Err(Error)` is raised into the
    VM by the dispatch bridge (`mrb_exc_raise`), and a VM raise is caught
    back into `Err` by exception protection (`mrb_protect_error`), which
    `sys::protect` offers a raw call. `Error::is_kind_of` asks the carried
    exception Ruby's `is_a?` (`mrb_obj_is_kind_of`). `Error::new`
    builds an exception error from a class and a message (via
    `mrb_exc_new`) for a handler to raise its own exception, and
    `Error::argnum` builds the canonical wrong-argument-count
    `ArgumentError` (via `mrb_argnum_error`) for a handler validating its
    own arity.
  ParseMessage: >-
    One compiler diagnostic's line, column, and text, read through accessors.
    mruby publishes `struct mrb_parser_message` as a parser field rather than
    through any call, so there is no C API to bind: the typed surface copies
    the slot out while the parser is alive and hands back an owned value that
    outlives it. `Ccontext::load_nstring` returns the first recorded error as
    `Error::Syntax`, and `Ccontext::warnings` answers the load's warnings.
  Error::backtrace: >-
    An exception's frames as rendered strings. Composes the already-graduated
    `ReprValue::funcall`, `TryConvert` for `RArray`, and the String-tag read rather
    than binding a C symbol — `mrb_exc_backtrace` is declared in
    `include/mruby/internal.h`, outside the embedder API the measure covers.
    Whatever holds no frames answers an empty list.
  ArenaScope: >-
    RAII GC-arena bracket over `mrb_gc_arena_save`/`mrb_gc_arena_restore`
    with a `mrb_gc_protect` keep — a safety guard with no single C API.
  GcRoot: >-
    The releasable root: a guard holding one slot of a table the interpreter
    keeps, released when the guard drops. Binds no new C symbol — it composes
    the already-graduated array and global-variable primitives — because the
    C pair it would otherwise wrap cannot carry it: `mrb_gc_unregister`
    removes by value, so one holder's release would drop every other root
    over the same value. A slot is the per-root identity mruby's registry
    lacks, the same role the storage address plays for CRuby's
    `rb_gc_register_address`. Released slots go on an intrusive free list so
    a long-running consumer's table stops growing. A refused release leaves
    the value rooted for the interpreter's remaining lifetime —
    over-retention, never a value collected while a holder still names it.
  Immediates: >-
    Cached qnil/qtrue/qfalse singletons over `mrb_nil_value` /
    `mrb_true_value` / `mrb_false_value`.
  DataType: >-
    Typed CDATA carrier over `mrb_data_type` + `mrb_data_object_alloc`,
    reached through `TypedData`, magnus's shape: a Rust type names its own
    `DataType` and class, so a wrap and a read take no descriptor. The class
    mark is a separate class-setup step (`RClass::set_instance_data_tt`) that
    magnus has no counterpart for, since mruby allocates a carrier only from
    a marked class; `TypedData`'s unsafe contract makes every class it names
    a marked one, which keeps wrapping infallible. The mark is refused unless
    the class allocates plain objects or is already a carrier, so no built-in
    layout is read as a carrier. The `DataType::dfree` release hook wraps the
    payload drop in `catch_unwind` so a panicking `T::drop` cannot unwind
    across the C frame of mruby's GC sweep, where unwinding is undefined.
  convert: >-
    `IntoValue` / `FromValue` trait conversions (magnus-style) layered on
    the value box/unbox primitives, including `FromValue for String` and
    `Vec<u8>` (an mruby string copied out as an owned UTF-8 `String` or as
    arbitrary owned bytes). Which numeric types convert follows the
    configured integer and float widths: a type converts only where it
    and the width hold every value of each other.
  IntoId: >-
    The symbol-or-name key, magnus's `IntoId`: resolves a `&CStr`, a Rust
    string, an `Id`, or a `Symbol` to the `Id` every name-keyed operation
    routes through mruby's `_id`-suffixed C variant with. Binds no C symbol
    of its own — it composes the interns — and is what keeps the raw id out
    of those operations' signatures.
  Id: >-
    The interned id as its own typed form, magnus's `Id`, beside the
    `Symbol` value handle: the two convert with `From`, boxing through
    `mrb_symbol_value` and unboxing through the `mrb_symbol` shim. It
    compares and hashes by the id — mruby publishes no C comparison to bind,
    interning being canonical — and a `Symbol` compares by the id it boxes.
  ExceptionClass: >-
    Typed handle on an exception class, magnus's `ExceptionClass`: only it
    builds or raises an exception, so `mrb_exc_new` / `mrb_exc_new_str` never
    meet a class whose instances are not exceptions. `Mrb::define_error` and
    `Module::define_error` compose `mrb_define_class_id` /
    `mrb_define_class_under_id` with an exception-class superclass. Binds no
    new C symbol.
  sys::AsRawValue / sys::FromRawValue / sys::AsRawId / sys::FromRawId: >-
    The raw seam as magnus's `rb_sys` traits carry it, beside the raw
    bindings: the safe read of a raw `mrb_value` out of any `ReprValue`
    handle or of the id out of an `Id`, and the `unsafe` crossings back into
    `Value` and `Id`. A class pointer has no crossing of its own, as in
    magnus: a class handle's raw form is its value, and a raw pointer crosses
    boxed as a value through the checked downcast. Binds no C symbol.
  ReprValue: >-
    Sealed trait over every typed handle that stands for a value, magnus's
    `ReprValue`: `as_value` answers that value — a class handle boxing its
    class through `mrb_obj_value` — and `sys::AsRawValue` reads the raw form
    out of any of them. Binds no C symbol of its own.
  prelude: >-
    magnus's `prelude`: the method-carrying traits (`ReprValue`, `Module`,
    `Object`, `FromValue`) imported anonymously in one line.
  sys::catch_unwind: >-
    Panic boundary for a Rust closure handed to mruby as a C callback,
    magnus's `rb_sys::catch_unwind`: runs the closure under
    `std::panic::catch_unwind` and answers `Error::Panic` carrying the
    payload's message. The registered-method bridge and `Mrb::init_gem`
    go through it. Binds no C symbol.
  Tagged handles: >-
    `RStruct`, `RSet`, `RRational` and `RComplex` downcast on the struct,
    set, rational and complex tags their gems allocate, which mruby gives
    no `mrb_*_p` macro; with the macro-backed handles they make every tag
    a typed caller can hold convertible into a handle.
  RArray::entries: >-
    `ExactSizeIterator` walk of an array by C-level index: composes the
    already-graduated `RArray::entry` (`mrb_ary_entry`) and `RArray::len`
    (`RARRAY_LEN`) over a length snapshot taken when the walk begins, binding
    no new C symbol. A live view rather than a content snapshot — a
    re-entrant mutation is only partly visible, and a position the array no
    longer reaches reads `nil` — dispatching no Ruby, the idiomatic Rust
    surface over mruby's caller-side index loop (which the C API has no
    iterator primitive for).
  RString::new_frozen: >-
    magnus's frozen copy, whose CRuby call `rb_str_new_frozen` mruby has no
    counterpart for: composes the already-graduated `RString::dup`
    (`mrb_str_dup`) and `ReprValue::freeze` (`mrb_obj_freeze`), answering
    the string itself when it is already frozen, as the CRuby call does.

# get_args format specifiers
# ==========================
#
# `mrb_get_args` is one symbol whose format string is a vocabulary of argument
# specifiers, so the vocabulary is its own coverage lens (see SPEC's coverage
# measure). Every specifier is covered through a part of `scan_args`, a
# `scan_args` read composed with a conversion, `get_kwargs`, or the typed method
# registration. `via` names the covering Rust surface; the `api:formats` gate
# checks that every specifier the crate hands `mrb_get_args` is marked covered.
get_args_formats:
  o: { status: covered, via: "scan_args required / optional / trailing parts, or the typed method registration" }
  C: { status: covered, via: "scan_args + FromValue<RClass> / FromValue<RModule>" }
  S: { status: covered, via: "scan_args + TryConvert<RString>" }
  A: { status: covered, via: "scan_args + TryConvert<RArray>" }
  H: { status: covered, via: "scan_args + TryConvert<RHash>" }
  s: { status: covered, via: "scan_args + FromValue<Vec<u8>> — a copy of the String argument's bytes" }
  z: { status: covered, via: "scan_args + RString::to_cstr" }
  a: { status: covered, via: "scan_args + RArray::entries" }
  c: { status: covered, via: "scan_args + FromValue<RClass> / FromValue<RModule>" }
  f: { status: covered, via: "scan_args + TryConvert<f64> / TryConvert<Float>" }
  i: { status: covered, via: "scan_args + TryConvert<i64> / TryConvert<Integer>" }
  b: { status: covered, via: "scan_args + FromValue<bool>" }
  n: { status: covered, via: "scan_args + FromValue<Symbol>" }
  d: { status: covered, via: "scan_args + TryConvert for &T / Obj<T>" }
  "&": { status: covered, via: "scan_args block part, or block-accepting registration" }
  "*": { status: covered, via: "scan_args splat part — an `RArray` handle or a converted Vec" }
  "|": { status: covered, via: "scan_args optional part, or optional-positional registration" }
  "?": { status: covered, via: "the Option a scan_args optional part or an optional-positional registration binds" }
  ":": { status: covered, via: "scan_args keyword part, then get_kwargs by name" }
  "!": { status: covered, via: "scan_args + FromValue<Option<T>> — nil reads as None, any other value by T's rule" }
  "+": { status: covered, via: "scan_args + ReprValue::check_frozen" }
subsumed:
  mrb_istruct_copy: "`Inline::set` with `Inline::get` — the payload copied between two inline structs of the same type, whose layout the type already carries"
  mrb_funcall: "`ReprValue::funcall` — the varargs form, which a Rust caller cannot write at all; the argument slice carries the count `argc` spells out, and `mrb_funcall_argv` is the same dispatch"
  mrb_funcall_id: "`ReprValue::funcall` — the varargs form taking a pre-interned `mrb_sym`; the symbol-or-name key already reaches it, and the argument slice carries `argc`"
  mrb_yield: "`Proc::call` — the one-argument form of `mrb_yield_argv` (`vendor/mruby/src/vm.c:1328` passes `1, &arg` to the same `yield_with_attr`); a Rust slice of one carries it"
  mrb_load_irep_buf: "`Mrb::load_bytecode` — the read-and-run form, whose body is `load_irep(mrb, mrb_proc_read_irep_buf(mrb, buf, bufsize), NULL)` and nothing else (`vendor/mruby/src/load.c:783-798`); the typed load drives the read and the run itself so it can name which structural check a blob failed, where the one-call form reports every one of them as `irep load error`, and it answers the same `ScriptError` for the same condition"
  mrb_load_irep: "`Mrb::load_bytecode` — the unbounded form of `mrb_load_irep_buf`, whose read passes `UINT32_MAX` where the buffer's size goes and trusts the header for the length (`vendor/mruby/src/load.c:732-737`, `:775-792`); a Rust byte slice carries the length the header would otherwise be trusted for, and the `undef` it answers for an unreadable blob without raising (`:778`) is the `Err` the typed load answers"
  mrb_proc_new_cfunc: "`Mrb::proc_new` — a proc whose body is a bare C function with no environment (`vendor/mruby/src/proc.c:141-152`); a Rust function carries the body the C function pointer would"
  mrb_load_irep_file: "`Mrb::load_bytecode` — the stream form, whose body reads the header and then the size it names from a `FILE*` and runs what it read with no context (`vendor/mruby/src/load.c:809-856`); a Rust caller reads the file through `std::fs`, and the byte slice carries what the stream yields"
  mrb_load_nstring: "`Mrb::load_string` — the context-free form, whose body is `mrb_load_nstring_cxt(mrb, s, len, NULL)` and nothing else (`vendor/mruby/mrbgems/mruby-compiler/core/parse.y:7868-7871`); the typed load borrows an unnamed context in the NULL's place so the compiler's diagnostics are captured rather than printed, which is all a fresh context changes for one load; carried by the `compiler` capability feature"
  mrb_load_nstring_cxt: "`Ccontext::load_nstring` — the one-call form, whose body is `mrb_load_exec(mrb, mrb_parse_nstring(mrb, s, len, c), c)` and nothing else (`vendor/mruby/mrbgems/mruby-compiler/core/parse.y:7862-7865`); the typed load drives those two calls itself so it can read the parser's diagnostic buffer between them, which the one-call form frees before returning; carried by the `compiler` capability feature"
  mrb_generate_code: "`Ccontext::compile` — the codegen half alone, taking the parser `mrb_parse_nstring` produced (`vendor/mruby/mrbgems/mruby-compiler/core/codegen.c:7336-7339`); the typed compile drives the parse and the codegen from source, so the parser the C form takes is what the Rust shape already carries, and beni hands a parser to no caller; carried by the `compiler` capability feature"
  mrb_load_string_cxt: "`Ccontext::load_nstring` — the NUL-terminated form of `mrb_load_nstring_cxt` over `strlen`; a Rust byte slice carries its own length, so the length-taking call subsumes it; carried by the `compiler` capability feature"
