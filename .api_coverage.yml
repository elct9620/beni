  mrb_ary_splat: "`RArray::to_ary` — the splat (`*`) coercion, dispatching `to_a` and always yielding an `RArray`; distinct from `TryConvert` for `RArray`, which takes only an Array"
  mrb_ary_splice: RArray::splice
  mrb_ary_unshift: RArray::unshift
  mrb_array_p: "`RArray::from_value`, the downcast reading the value tag"
  mrb_assoc_new: Mrb::assoc_new
  mrb_as_float: "`TryConvert` for `f64` — the Float coercion read out, `Float::try_convert` then `Float::to_f64`; answers `f64`, which holds every configured float width"
  mrb_as_int: "`TryConvert` for the Rust integers — the narrowed Integer coercion read out, `Integer::try_convert` then `Integer::to_i64`"
  mrb_attr_get: "`Object::ivar_get` — `mrb_attr_get(mrb, obj, id)` is a forwarding wrapper whose body is `return mrb_iv_get(mrb, obj, id)`, reading any symbol's instance slot with no `@`-prefix validation; `ivar_get` takes the same symbol-or-name key with the same absence of validation, so it yields an identical value for every key a typed caller can form and no separate item is needed"
  mrb_block_given_p: "`Mrb::block_given` — whether the current call was passed a block; a total predicate that never raises"
  mrb_break_p: ReprValue::as_break
  mrb_class_new_instance: "`RClass::new_instance` — the `MRB_INLINE` `mrb_class_new_instance(mrb, argc, argv, c)` is an `@see mrb_obj_new` alias whose body is `return mrb_obj_new(mrb, c, argc, argv)`, differing only in C parameter order; it yields an identical instance for every receiver and argument list a typed caller can form, so no separate item is needed"
  mrb_class_p: "`RClass::from_value` with `RClass::is_singleton` false — the downcast accepts the class and singleton-class tags alike"
  mrb_data_p: "`RTypedData::from_value`, the downcast reading the value tag"
  mrb_istruct_p: "`RInlineStruct::from_value`, the downcast reading the value tag"
  mrb_cptr_p: "`RCptr::from_value`, the downcast reading the value tag"
  mrb_exception_p: "`Exception::from_value`, the downcast reading the value tag"
  mrb_float_p: "`Float::from_value`, the downcast reading the value tag"
  mrb_hash_p: "`RHash::from_value`, the downcast reading the value tag"
  mrb_integer_p: "`Integer::from_value` — accepts the fixed-width tag `mrb_integer_p` tests and the arbitrary-width tag beside it, as magnus's `Integer` takes a Fixnum or a Bignum"
  mrb_module_p: "`RModule::from_value`, the downcast reading the value tag"
  mrb_proc_p: "`Proc::from_value`, the downcast reading the value tag"
  mrb_proc_new_cfunc_with_env: "`Mrb::proc_new`, `Mrb::proc_from_fn` — the Rust body rides in a data carrier held in the proc's one environment slot, which the proc and its copies share (`vendor/mruby/src/proc.c:166-190`, `:288`), so the collector drops the body with the last of them"
  mrb_range_p: "`Range::from_value`, the downcast reading the value tag"
  mrb_sclass_p: "`RClass::is_singleton` on a `RClass::from_value` handle — the downcast accepts the class and singleton-class tags alike, and mruby keeps `singleton_class?` in the class-ext gem"
