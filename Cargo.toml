# Cargo workspace for the beni crates; the beni Ruby gem cohabits at the
# repo root (rb-sys uses the same gem + crates layout).
[workspace]
members = ["crates/beni-sys", "crates/beni", "crates/beni-tests"]
# beni-tests always needs a real libmruby.a, so it stays out of the
# selection a bare cargo command uses; the gates that stage an archive
# reach it with an explicit --workspace.
default-members = ["crates/beni-sys", "crates/beni"]
# The consumer scenarios are consumers' projects, not members of this
# workspace; excluding them here is what lets each manifest stay the
# shape a consumer's actually is — which for embedded_no_compiler
# includes turning beni's default features off, a choice workspace
# feature unification would otherwise take back.
exclude = [
  "test/scenarios/rust_consumer",
  "test/scenarios/embedded_no_compiler",
  "test/scenarios/macos_universal",
]
resolver = "2"

[workspace.package]
version = "0.14.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/elct9620/beni"
