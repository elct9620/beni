# beni — typed Rust wrapper crate over the `beni-sys` FFI surface.
#
# Mirrors the magnus / rb-sys split applied at the mruby boundary:
# `beni-sys` owns the bindgen-generated `extern "C"` surface and the
# layout-safe C shims; this crate owns every Rust-level abstraction
# above it (the `Mrb` / `Ccontext` RAII types, the `Value` / `Class` /
# `Array` / `Hash` newtypes, the `IntoValue` / `FromValue` trait seam,
# the `Format`-based `mrb_get_args` dispatch, and the `protect`
# closure wrapper). Consumers `use beni::Mrb` for typed access and
# fall through to `beni::sys::mrb_*` only at the raw-FFI escape
# hatch.

[package]
name = "beni"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed Rust wrapper over the mruby C API, sitting on the `beni-sys` bindgen surface."
readme = "README.md"
keywords = ["mruby", "ruby", "bindings", "embedding"]
categories = ["api-bindings"]

# docs.rs cross-compiles anything but its default target, and this
# crate refuses a cross target it has no archive for. Building the
# default alone keeps the rendered page to the platform the
# documentation bindings describe.
# The dependency features are enabled so their conversions are shown.
[package.metadata.docs.rs]
default-target = "x86_64-unknown-linux-gnu"
targets = []
features = ["bytes"]

[lib]
# `rlib` only — consumers link this crate as a path / registry
# dependency; their own artefact carries the final symbol surface.
crate-type = ["rlib"]

# Capability features carry what mruby keeps in a gem rather than its
# core. They are declared, never probed: the crate reads no gem
# inventory, so what a consumer enables is what exists. Each only adds
# surface, and every one is on by default.
[features]
default = ["compiler"]
# `compiler` — mruby's compiler gem: the compile context and the loads
# that compile Ruby source into the running interpreter. A consumer that
# never compiles Ruby at run time turns default features off; loading
# precompiled bytecode needs no compiler and stays outside it.
compiler = []
# Dependency features carry the conversions to a third-party crate's
# types, gated as magnus gates the same integration. Each only adds
# surface, and every one is off by default.
# `bytes` — `TryConvert` / `IntoValue` for `bytes::Bytes`.
bytes = ["dep:bytes"]

[dependencies]
# `beni-sys` — sibling crate carrying the bindgen-generated FFI
# surface plus the layout-safe C shims. Re-exported through `sys` for
# raw-FFI escape hatch access (`beni::sys::mrb_*`). The version
# requirement is what registry consumers resolve against.
beni-sys = { path = "../beni-sys", version = "0.16.0" }
# `beni-macros` — the attribute and derive macros, re-exported at the
# crate root as `beni::wrap` and `beni::TypedData`.
beni-macros = { path = "../beni-macros", version = "0.16.0" }
bytes = { version = "1", optional = true }
